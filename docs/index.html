<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindfulBreath</title>
<script src="https://unpkg.com/@vernier/godirect@1.8.3/dist/godirect.min.umd.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --frame: #000000;
    --base: #e9ecef;
    --active: #2f9e6b;
    --done: #b9e3cf;
    --dot: #009600;
    --warn: #c0392b;
    --pill: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--pill); border-radius: 999px; padding: 6px 12px; font-size: 13px;
  }
  .led { width: 9px; height: 9px; border-radius: 50%; background: #aaa; }
  .led.on { background: #22c55e; }
  .led.demo { background: #f59e0b; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
  .stage { display: none; flex-direction: column; align-items: center; gap: 14px; }
  .stage.show { display: flex; }

  /* 기존 OpenCV UI의 흰 프레임 + 검은 테두리 재현 */
  .frame-wrap { position: relative; padding: 56px 84px; }
  .frame {
    width: var(--size); height: var(--size);
    border: 5px solid var(--frame); position: relative; background: #fff;
  }
  /* main.py: 600px 프레임 안에 550px 정사각형으로 리사이즈된 이미지 */
  .frame img.body { position: absolute; inset: 25px; width: calc(100% - 50px); height: calc(100% - 50px); object-fit: fill; }
  .caption-top, .caption-bottom { position: absolute; left: 84px; right: 84px; font-size: 22px; font-weight: 600; }
  .caption-top { top: 12px; }
  .caption-bottom { bottom: 10px; }
  .side-label { position: absolute; font-size: 22px; font-weight: 700; }
  .lbl-top { top: 16px; left: 50%; transform: translateX(-50%); }
  .lbl-right { right: 26px; top: 50%; transform: translateY(-50%); }
  .lbl-bottom { bottom: 14px; left: 50%; transform: translateX(-50%); }
  .lbl-left { left: 22px; top: 50%; transform: translateY(-50%); }
  .side-label.now { color: var(--dot); }
  .dot {
    position: absolute; width: 40px; height: 40px; border-radius: 50%;
    background: var(--dot); transform: translate(-50%, -50%); pointer-events: none;
  }
  .phase { font-size: 28px; font-weight: 700; min-height: 1.3em; }
  .sub { color: var(--muted); font-size: 14px; }

  .card { max-width: 520px; width: calc(100vw - 32px); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .card h2 { margin: 0; font-size: 26px; }
  .card p { margin: 0; color: var(--muted); line-height: 1.6; }
  .big { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=text], input[type=number] {
    font: inherit; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; width: 220px; text-align: center;
  }
  button {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 10px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; cursor: pointer;
  }
  button.ghost { background: #fff; color: var(--ink); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .warn { color: var(--warn); font-size: 14px; }
  kbd { border: 1px solid #bbb; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .progress { display: flex; gap: 6px; }
  .progress span { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--pill); color: var(--muted); }
  .progress span.cur { background: var(--active); color: #fff; }
  .progress span.done { background: var(--done); color: #1d5e40; }

  footer { border-top: 1px solid var(--line); padding: 8px 20px 10px; display: flex; gap: 16px; align-items: center; }
  footer canvas { flex: 1; height: 70px; width: 100%; display: block; }
  .readout { font-size: 13px; color: var(--muted); min-width: 170px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  .readout b { color: var(--ink); font-size: 18px; }
  .timer { position: absolute; top: 14px; right: 20px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>MindfulBreath</h1>
  <span class="pill"><span class="led" id="led"></span><span id="statusText">센서 미연결</span></span>
</header>

<main>
  <div class="timer" id="timer"></div>

  <!-- 0. 시작 -->
  <section class="stage show" id="stage-start">
    <div class="card">
      <h2>Every breath you take, every mind you wake</h2>
      <p>호흡벨트를 가슴에 착용하고 전원을 켠 뒤 USB 또는 블루투스로 연결하세요.<br>아래 그래프에서 호흡에 따라 값이 움직이면 준비 완료입니다.</p>
      <div class="row">
        <button class="ghost" id="btnBle">블루투스로 연결</button>
        <button class="ghost" id="btnUsb">USB로 연결</button>
        <button class="ghost" id="btnDemo">벨트 없이 체험</button>
      </div>
      <span class="warn" id="supportWarn"></span>
      <input type="text" id="pid" placeholder="참가자 ID (선택)">
      <button id="btnStart" disabled>측정 시작 <kbd>Space</kbd></button>
      <span class="sub" id="startHint">먼저 호흡벨트를 연결하세요 (PC의 Chrome 또는 Edge 권장)</span>
    </div>
  </section>

  <!-- 1~2, 4: 프레임 화면 공용 -->
  <section class="stage" id="stage-frame">
    <div class="frame-wrap">
      <div class="caption-top" id="capTop"></div>
      <div class="side-label lbl-top" data-side="0">In</div>
      <div class="side-label lbl-right" data-side="1">Out</div>
      <div class="side-label lbl-bottom" data-side="2">In</div>
      <div class="side-label lbl-left" data-side="3">Out</div>
      <div class="frame" id="frame">
        <img class="body" id="bodyImg" alt="">
      </div>
      <div class="dot" id="dot"></div>
      <div class="caption-bottom" id="capBottom"></div>
    </div>
    <div class="phase" id="phase"></div>
    <div class="progress" id="progress"></div>
  </section>

  <!-- 3. 추천 -->
  <section class="stage" id="stage-recommend">
    <div class="card">
      <h2>추천 호흡 주기</h2>
      <p>평소 호흡보다 약 10% 느린 속도를 추천합니다.</p>
      <div class="big" id="recText">-</div>
      <span class="sub" id="recDetail"></span>
      <span class="warn" id="recWarn"></span>
      <div class="row">
        <button id="btnAccept">이 속도로 시작 <kbd>Enter</kbd></button>
        <button class="ghost" id="btnManual">직접 설정 <kbd>S</kbd></button>
      </div>
      <div class="row" id="manualRow" style="display:none">
        <label class="sub" for="manualInput">들숨(=날숨) 한 변 시간(초)</label>
        <input type="number" id="manualInput" step="0.1" min="1" max="15">
        <button class="ghost" id="btnManualOk">적용</button>
      </div>
    </div>
  </section>

  <!-- 5. 종료 -->
  <section class="stage" id="stage-end">
    <div class="card">
      <h2>수고하셨습니다</h2>
      <p id="endText"></p>
      <div class="row">
        <button id="btnAgain">운동 한 번 더</button>
        <button class="ghost" id="btnRestart">처음부터</button>
        <button class="ghost" id="btnSave">기록 저장 (CSV)</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="readout">
    Force <b id="forceVal">-</b> N<br>
    <span id="rangeVal">min - / max -</span> · <span id="hzVal">0</span> Hz
  </div>
  <canvas id="wave"></canvas>
</footer>

<script>
// ───────── 설정 (main.py 값과 동일) ─────────
const INIT_TIME = 20;      // 초기화(최소/최대 측정) 시간(초)
const DETECT_TIME = 20;    // 호흡 주기 감지 시간(초)
const SLOWER = 1.1;        // 추천 = 평소보다 10% 느리게
const DEFAULT_SIDE = 4.0;  // 감지 실패 시 기본값(초)
// README 순서: spine → right arm → left arm → head → right leg → left leg → heart
const SECTIONS = [
  { id: 'spine',    name: '척추' },
  { id: 'rightarm', name: '오른팔' },
  { id: 'leftarm',  name: '왼팔' },
  { id: 'head',     name: '머리' },
  { id: 'rightleg', name: '오른다리' },
  { id: 'leftleg',  name: '왼다리' },
  { id: 'heart',    name: '심장' },
];

// ───────── 원본 프레임 이미지 (content/<부위>/<번호>.jpg) ─────────
// main.py: level = int(normalized_force * (len(images) - 1)) → images[level]
const COL = { active: getComputedStyle(document.documentElement).getPropertyValue('--active').trim() };
const FRAMES = {};   // part → [url, ...] (번호순)
const cache = {};    // url → Image (미리 불러오기)
let currentSrc = '';
fetch('content/index.json').then(r => r.json()).then(idx => {
  for (const [part, files] of Object.entries(idx)) {
    FRAMES[part] = files.map(f => `content/${part}/${f}`);
  }
  // 첫 화면에 쓰이는 부위부터 미리 불러오기
  const order = ['head', 'rightarm', ...SECTIONS.map(s => s.id)];
  [...new Set(order)].forEach(part => (FRAMES[part] || []).forEach(u => { const im = new Image(); im.src = u; cache[u] = im; }));
});
function showFrame(part, level) {
  const list = FRAMES[part];
  if (!list || !list.length) return;
  const src = list[Math.min(list.length - 1, Math.max(0, Math.floor(level * (list.length - 1))))];
  if (src !== currentSrc) { $('bodyImg').src = src; currentSrc = src; }
}

// ───────── 데이터 수신 (브라우저에서 GDX 벨트에 직접 연결: Web Bluetooth / WebHID) ─────────
let force = null, fmin = null, fmax = null;
const samples = []; // {t, f}
let connected = false, arrivals = [];
const $ = id => document.getElementById(id);
const forceLog = [], eventLog = []; // main.py와 같은 Timestamp, Force Value + UI 이벤트
let device = null, demoTimer = null;

function setStatus(on, kind, text) {
  connected = on;
  $('led').className = 'led' + (on ? (kind === 'demo' ? ' demo' : ' on') : '');
  $('statusText').textContent = text;
  $('btnStart').disabled = !on;
  $('startHint').textContent = on ? '신호 수신 중 — 시작할 수 있습니다' : text;
}

function pushSample(f) {
  if (!Number.isFinite(f)) return;
  force = f;
  forceLog.push([Date.now() / 1000, f]);
  const now = performance.now() / 1000;
  samples.push({ t: now, f });
  while (samples.length && now - samples[0].t > 15) samples.shift();
  arrivals.push(now);
  while (arrivals.length && now - arrivals[0] > 1) arrivals.shift();
  onSample(f, now);
}

function stopSources() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  if (device) { try { device.close(); } catch (e) {} device = null; }
}

async function connectGdx(bluetooth) {
  stopSources();
  setStatus(false, '', '센서 선택 창에서 GDX-RB를 고른 뒤 "페어링/연결"을 누르세요');
  try {
    device = await godirect.selectDevice(bluetooth);
    device.stop();
    device.sensors.forEach(sn => sn.setEnabled(false));
    const sensor = device.getSensor(1); // GDX-RB 1번 센서: Force (N)
    sensor.setEnabled(true);
    sensor.on('value-changed', sn => pushSample(sn.value));
    device.on('device-closed', () => { if (device) setStatus(false, '', '벨트 연결이 끊겼습니다. 다시 연결하세요'); device = null; });
    device.start(50);
    setStatus(true, 'gdx', `${device.name} (${bluetooth ? '블루투스' : 'USB'}) · ${sensor.name} 수신 중`);
    logEvent('connect', { device: device.name, link: bluetooth ? 'ble' : 'usb' });
  } catch (err) {
    console.error(err);
    device = null;
    let msg = String(err && err.message || err);
    if (/cancel|chosen/i.test(msg)) msg = '센서를 선택하지 않았습니다';
    else if (/cross-origin|iframe|permissions policy/i.test(msg)) msg = '임베드된 화면에서는 센서 연결이 막혀 있습니다. 새 창(탭)에서 열어 주세요';
    else if (/characteristics not found/i.test(msg)) msg = '벨트의 데이터 채널이 다른 연결에 잡혀 있습니다. 벨트 전원을 완전히 껐다 켜고(PC 블루투스도 껐다 켜기), Graphical Analysis 등 다른 앱을 종료한 뒤 다시 시도하세요. USB 케이블로 연결해도 됩니다';
    else if (/GATT|connect/i.test(msg)) msg = '연결 실패: 벨트 전원을 껐다 켜고, Graphical Analysis 등 다른 앱의 연결을 해제한 뒤 다시 시도하세요';
    setStatus(false, '', msg);
  }
}

function startDemo() {
  stopSources();
  const t0 = performance.now();
  demoTimer = setInterval(() => {
    const ph = (performance.now() - t0) / 1000 * 2 * Math.PI / 5;
    pushSample(2 + 1.5 * (0.5 - 0.5 * Math.cos(ph)) + (Math.random() - 0.5) * 0.06);
  }, 50);
  setStatus(true, 'demo', '데모 모드 (가상 호흡 신호)');
  logEvent('connect', { device: 'demo' });
}

function logEvent(event, detail = {}) {
  eventLog.push([Date.now() / 1000, event, JSON.stringify({ pid: $('pid').value || null, ...detail })]);
}

function downloadCsv(name, header, rows) {
  const esc = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const text = '﻿' + [header, ...rows].map(r => r.map(esc).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function saveLogs() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const pid = ($('pid').value || 'anon').replace(/[^\w-]/g, '_');
  downloadCsv(`force_${pid}_${stamp}.csv`, ['Timestamp', 'Force Value'], forceLog);
  setTimeout(() => downloadCsv(`events_${pid}_${stamp}.csv`, ['Timestamp', 'Event', 'Detail'], eventLog), 300);
}

(function checkSupport() {
  const warn = [];
  if (!navigator.bluetooth) { $('btnBle').disabled = true; warn.push('이 브라우저는 블루투스 연결을 지원하지 않습니다'); }
  if (!navigator.hid) { $('btnUsb').disabled = true; warn.push('USB 연결 미지원'); }
  if (!navigator.bluetooth && !navigator.hid) warn.push('PC의 Chrome 또는 Edge에서 열어 주세요');
  if (window.self !== window.top) warn.push('센서 연결이 안 되면 이 페이지를 새 탭에서 열어 주세요');
  $('supportWarn').textContent = warn.join(' · ');
})();

// ───────── 단계 진행 ─────────
let stage = 'start', stageStart = 0;
let cycleTimes = [], above = false, lastRise = null, cycleStatus = 'Waiting..';
let side = DEFAULT_SIDE, recommendedSide = DEFAULT_SIDE, baselinePeriod = null;
let lastSection = -1;

function show(id) {
  document.querySelectorAll('.stage').forEach(s => s.classList.toggle('show', s.id === id));
}
function setStage(next) {
  stage = next; stageStart = performance.now() / 1000;
  logEvent('stage', { stage: next });
  if (next === 'init') { fmin = fmax = null; show('stage-frame'); }
  if (next === 'detect') { cycleTimes = []; above = false; lastRise = null; cycleStatus = 'Waiting..'; show('stage-frame'); }
  if (next === 'recommend') { show('stage-recommend'); renderRecommend(); }
  if (next === 'exercise') { lastSection = -1; show('stage-frame'); }
  if (next === 'end') { show('stage-end'); }
  if (next === 'start') { show('stage-start'); }
  document.querySelectorAll('.side-label').forEach(l => l.style.visibility = next === 'exercise' ? 'visible' : 'hidden');
  $('dot').style.display = next === 'exercise' ? 'block' : 'none';
  $('progress').innerHTML = '';
  $('phase').textContent = '';
}

function level01(f) {
  if (fmin === null || fmax === null) return 0;
  return Math.min(1, Math.max(0, (f - fmin) / Math.max(fmax - fmin, 1e-6)));
}

function onSample(f, now) {
  if (stage === 'init') {
    if (fmin === null || f < fmin) fmin = f;
    if (fmax === null || f > fmax) fmax = f;
  } else if (stage === 'detect') {
    // 히스테리시스로 들숨 시작(상승 교차) 사이 간격 = 한 호흡 주기
    const hi = fmin + (fmax - fmin) * 0.6, lo = fmin + (fmax - fmin) * 0.4;
    if (!above && f > hi) {
      above = true; cycleStatus = 'Inhale';
      if (lastRise !== null) {
        const p = now - lastRise;
        if (p > 1.5 && p < 30) cycleTimes.push(p);
      }
      lastRise = now;
    } else if (above && f < lo) {
      above = false; cycleStatus = 'Exhale';
    }
  }
}

function renderRecommend() {
  const range = fmax - fmin;
  if (cycleTimes.length) {
    baselinePeriod = cycleTimes.reduce((a, b) => a + b, 0) / cycleTimes.length;
    recommendedSide = baselinePeriod / 2 * SLOWER;
  } else {
    baselinePeriod = null;
    recommendedSide = DEFAULT_SIDE;
  }
  side = recommendedSide;
  $('recText').textContent = `${(side * 2).toFixed(1)}초 / 1호흡`;
  $('recDetail').textContent = `들숨 ${side.toFixed(1)}초 · 날숨 ${side.toFixed(1)}초` +
    (baselinePeriod ? `  (평소 ${baselinePeriod.toFixed(1)}초, ${cycleTimes.length}회 감지)` : '  (주기를 감지하지 못해 기본값 사용)');
  $('recWarn').textContent = range < 0.15 ? '호흡에 따른 힘 변화가 작습니다. 벨트를 조금 더 조인 뒤 처음부터 다시 측정해 보세요.' : '';
  $('manualRow').style.display = 'none';
  $('manualInput').value = side.toFixed(1);
  logEvent('recommend', { baselinePeriod, recommendedSide, cycles: cycleTimes.length, fmin, fmax });
}

// main.py get_dot_position 과 동일: 사각형 테두리를 따라 한 변 = 들숨 또는 날숨
function dotPos(size, t, perSide) {
  const tt = t % (4 * perSide), k = (tt % perSide) / perSide;
  const s = Math.floor(tt / perSide);
  if (s === 0) return [k * size, 0, s];
  if (s === 1) return [size, k * size, s];
  if (s === 2) return [size - k * size, size, s];
  return [0, size - k * size, s];
}

// ───────── 렌더 루프 ─────────
function frameSize() {
  const s = Math.floor(Math.min(window.innerHeight - 330, window.innerWidth - 200, 600));
  return Math.max(220, s);
}
function tick() {
  const now = performance.now() / 1000, el = now - stageStart;
  const size = frameSize();
  document.documentElement.style.setProperty('--size', size + 'px');
  const lv = force === null ? 0 : level01(force);

  if (stage === 'init') {
    if (fmin !== null && fmin === fmax) fmax = fmin + 1e-6;
    $('capTop').textContent = 'Initialization...';
    $('capBottom').textContent = force === null ? '' : `Your force is ${force.toFixed(3)}`;
    $('phase').textContent = '편안하게 평소처럼 숨 쉬세요';
    showFrame('head', 0);  // main.py: content/head/1.jpg
    $('timer').textContent = `초기화 ${Math.max(0, INIT_TIME - el).toFixed(0)}초`;
    if (el >= INIT_TIME) setStage('detect');
  } else if (stage === 'detect') {
    $('capTop').textContent = 'Detecting Cycle...';
    $('capBottom').textContent = cycleStatus;
    $('phase').textContent = `감지된 호흡 ${cycleTimes.length}회`;
    showFrame('rightarm', lv);
    $('timer').textContent = `주기 감지 ${Math.max(0, DETECT_TIME - el).toFixed(0)}초`;
    if (el >= DETECT_TIME) setStage('recommend');
  } else if (stage === 'exercise') {
    const sectionDur = side * 4; // 부위당 2호흡 (In-Out-In-Out)
    const idx = Math.floor(el / sectionDur);
    if (idx >= SECTIONS.length) { finishExercise(true); }
    else {
      if (idx !== lastSection) { lastSection = idx; logEvent('section', { section: SECTIONS[idx].id }); }
      showFrame(SECTIONS[idx].id, lv);
      const [x, y, s] = dotPos(size, el, side);
      const fr = $('frame').getBoundingClientRect(), wrap = $('frame').parentElement.getBoundingClientRect();
      $('dot').style.left = (fr.left - wrap.left + 2.5 + x * (size - 5) / size) + 'px';
      $('dot').style.top = (fr.top - wrap.top + 2.5 + y * (size - 5) / size) + 'px';
      document.querySelectorAll('.side-label').forEach(l => l.classList.toggle('now', +l.dataset.side === s));
      $('capTop').textContent = ''; $('capBottom').textContent = '';
      $('phase').textContent = `${SECTIONS[idx].name}으로 숨을 ${s % 2 === 0 ? '들이쉬세요' : '내쉬세요'}`;
      $('progress').innerHTML = SECTIONS.map((sec, i) =>
        `<span class="${i < idx ? 'done' : i === idx ? 'cur' : ''}">${sec.name}</span>`).join('');
      const remain = SECTIONS.length * sectionDur - el;
      $('timer').textContent = `남은 시간 ${Math.floor(remain / 60)}:${String(Math.floor(remain % 60)).padStart(2, '0')}`;
    }
  } else {
    $('timer').textContent = '';
  }

  // 하단 readout + 파형
  $('forceVal').textContent = force === null ? '-' : force.toFixed(3);
  $('rangeVal').textContent = fmin === null ? 'min - / max -' : `min ${fmin.toFixed(2)} / max ${fmax.toFixed(2)}`;
  $('hzVal').textContent = arrivals.length;
  drawWave(now);
  requestAnimationFrame(tick);
}

function drawWave(now) {
  const c = $('wave'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (samples.length < 2) return;
  let lo = Infinity, hi = -Infinity;
  for (const s of samples) { lo = Math.min(lo, s.f); hi = Math.max(hi, s.f); }
  if (fmin !== null) { lo = Math.min(lo, fmin); hi = Math.max(hi, fmax); }
  const pad = (hi - lo) * 0.15 || 0.1; lo -= pad; hi += pad;
  const Y = f => h - (f - lo) / (hi - lo) * h, X = t => w - (now - t) / 15 * w;
  if (fmin !== null && stage !== 'init') {
    ctx.strokeStyle = '#d0d0d0'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    for (const v of [fmin, fmax]) { ctx.beginPath(); ctx.moveTo(0, Y(v)); ctx.lineTo(w, Y(v)); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = COL.active; ctx.lineWidth = 2; ctx.beginPath();
  samples.forEach((s, i) => i ? ctx.lineTo(X(s.t), Y(s.f)) : ctx.moveTo(X(s.t), Y(s.f)));
  ctx.stroke();
}

function finishExercise(completed) {
  logEvent('end', { completed, side });
  $('endText').textContent = completed
    ? `7개 부위 바디스캔 호흡을 마쳤습니다. (들숨/날숨 ${side.toFixed(1)}초)`
    : '운동을 중단했습니다.';
  setStage('end');
}

// ───────── 입력 ─────────
function acceptRec(manual) {
  if (manual) {
    const v = parseFloat($('manualInput').value);
    if (!(v >= 1 && v <= 15)) return;
    side = v;
  }
  logEvent('accept', { side, manual: !!manual });
  setStage('exercise');
}
$('btnStart').onclick = () => { if (connected) setStage('init'); };
$('btnAccept').onclick = () => acceptRec(false);
$('btnManual').onclick = () => { $('manualRow').style.display = 'flex'; $('manualInput').focus(); $('manualInput').select(); };
$('btnManualOk').onclick = () => acceptRec(true);
$('manualInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); acceptRec(true); } });
$('btnAgain').onclick = () => setStage('exercise');
$('btnRestart').onclick = () => setStage('start');
$('btnSave').onclick = saveLogs;
$('btnBle').onclick = () => connectGdx(true);
$('btnUsb').onclick = () => connectGdx(false);
$('btnDemo').onclick = startDemo;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (stage === 'start' && e.code === 'Space' && connected) { e.preventDefault(); setStage('init'); }
  else if (stage === 'recommend' && e.key === 'Enter') acceptRec(false);
  else if (stage === 'recommend' && (e.key === 's' || e.key === 'S')) $('btnManual').click();
  else if (e.key === 'Escape' && ['init', 'detect', 'exercise'].includes(stage)) finishExercise(false);
});

setStage('start');
requestAnimationFrame(tick);
</script>
</body>
</html>
